<pre id="report">measuring…</pre>
<script>
  history.replaceState(null, "", "/the-mom-test/1-chapter-one");
</script>
<script src="../reader.js"></script>
<script>
  const chapter = document.getElementById("toc-chapter-one");
  const intro = document.getElementById("toc-intro");
  const ok =
    chapter.classList.contains("active-chapter") &&
    chapter.getAttribute("aria-current") === "location" &&
    !intro.classList.contains("active-chapter");
  document.getElementById("report").textContent =
    (ok ? "PASS" : "FAIL") +
    "\npathname=" + location.pathname +
    "\nchapterActive=" + chapter.classList.contains("active-chapter") +
    "\nintroActive=" + intro.classList.contains("active-chapter");
  document.title = ok ? "PASS" : "FAIL";
</script>
